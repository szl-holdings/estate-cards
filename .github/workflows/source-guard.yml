name: Source-owned Hugging Face guard (offline)

on:
  pull_request:
    paths:
      - "weaver/source_guard.py"
      - "weaver/rollout_hf.py"
      - "tests/test_source_guard.py"
      - ".github/workflows/source-guard.yml"
  push:
    branches: [main]
    paths:
      - "weaver/source_guard.py"
      - "weaver/rollout_hf.py"
      - "tests/test_source_guard.py"
      - ".github/workflows/source-guard.yml"

# This is source-only contract validation. No provider auth, no Hub writes.
permissions:
  contents: read

concurrency:
  group: source-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Execute negative fixtures without a Hub credential
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eu
          python -B -m unittest discover -s tests -p 'test_source_guard.py' -v
          python -B -c "import weaver.rollout_hf; print('IMPORT_NO_CREDENTIAL_READ')"
